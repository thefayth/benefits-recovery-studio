<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">California Benefits Desk supervised workflow</title>
  <desc id="desc">A six-step private preparation workflow: notice or task, reviewed facts and sources, approved documents, visible portal session, human review and approval, then receipt and follow-up. Live filing is not verified.</desc>
  <rect width="1440" height="720" fill="#f1f4f1"/>
  <rect width="1440" height="190" fill="#193e32"/>
  <rect y="184" width="1440" height="6" fill="#c89232"/>
  <text x="64" y="82" fill="#f8faf8" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="800">CALIFORNIA BENEFITS DESK</text>
  <text x="66" y="130" fill="#f1ce7c" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">Private preparation. Human-controlled filing.</text>
  <text x="66" y="162" fill="#e1e9e4" font-family="Segoe UI, Arial, sans-serif" font-size="17">A Papercut workflow for California benefits paperwork and monthly START reports</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="56" y="270" width="188" height="170" fill="#ffffff" stroke="#235b49" stroke-width="3"/>
    <rect x="56" y="270" width="188" height="10" fill="#235b49"/>
    <text x="76" y="316" fill="#235b49" font-size="14" font-weight="800">01 / INTAKE</text>
    <text x="76" y="354" fill="#202c27" font-size="20" font-weight="750">Notice or</text>
    <text x="76" y="380" fill="#202c27" font-size="20" font-weight="750">task</text>
    <text x="76" y="417" fill="#53625b" font-size="14">Deadline and next step</text>

    <path d="M252 355h22m-8-8 8 8-8 8" fill="none" stroke="#235b49" stroke-width="3"/>

    <rect x="280" y="270" width="188" height="170" fill="#ffffff" stroke="#235b49" stroke-width="3"/>
    <rect x="280" y="270" width="188" height="10" fill="#235b49"/>
    <text x="300" y="316" fill="#235b49" font-size="14" font-weight="800">02 / PROVENANCE</text>
    <text x="300" y="354" fill="#202c27" font-size="20" font-weight="750">Review facts</text>
    <text x="300" y="380" fill="#202c27" font-size="20" font-weight="750">and sources</text>
    <text x="300" y="417" fill="#53625b" font-size="14">Unknowns stay visible</text>

    <path d="M476 355h22m-8-8 8 8-8 8" fill="none" stroke="#235b49" stroke-width="3"/>

    <rect x="504" y="270" width="188" height="170" fill="#ffffff" stroke="#c89232" stroke-width="3"/>
    <rect x="504" y="270" width="188" height="10" fill="#c89232"/>
    <text x="524" y="316" fill="#725015" font-size="14" font-weight="800">03 / DOCUMENTS</text>
    <text x="524" y="354" fill="#202c27" font-size="20" font-weight="750">Review each</text>
    <text x="524" y="380" fill="#202c27" font-size="20" font-weight="750">required file</text>
    <text x="524" y="417" fill="#53625b" font-size="14">Originals are preserved</text>

    <path d="M700 355h22m-8-8 8 8-8 8" fill="none" stroke="#235b49" stroke-width="3"/>

    <rect x="728" y="270" width="188" height="170" fill="#ffffff" stroke="#235b49" stroke-width="3"/>
    <rect x="728" y="270" width="188" height="10" fill="#235b49"/>
    <text x="748" y="316" fill="#235b49" font-size="14" font-weight="800">04 / PORTAL</text>
    <text x="748" y="354" fill="#202c27" font-size="20" font-weight="750">Visible sign-in</text>
    <text x="748" y="380" fill="#202c27" font-size="20" font-weight="750">and session</text>
    <text x="748" y="417" fill="#53625b" font-size="14">MFA stays with you</text>

    <path d="M924 355h22m-8-8 8 8-8 8" fill="none" stroke="#235b49" stroke-width="3"/>

    <rect x="952" y="270" width="188" height="170" fill="#ffffff" stroke="#a24d45" stroke-width="3"/>
    <rect x="952" y="270" width="188" height="10" fill="#a24d45"/>
    <text x="972" y="316" fill="#7b3933" font-size="14" font-weight="800">05 / APPROVAL</text>
    <text x="972" y="354" fill="#202c27" font-size="20" font-weight="750">You review</text>
    <text x="972" y="380" fill="#202c27" font-size="20" font-weight="750">and approve</text>
    <text x="972" y="417" fill="#53625b" font-size="14">No silent submission</text>

    <path d="M1148 355h22m-8-8 8 8-8 8" fill="none" stroke="#235b49" stroke-width="3"/>

    <rect x="1176" y="270" width="208" height="170" fill="#ffffff" stroke="#235b49" stroke-width="3"/>
    <rect x="1176" y="270" width="208" height="10" fill="#235b49"/>
    <text x="1196" y="316" fill="#235b49" font-size="14" font-weight="800">06 / FOLLOW-UP</text>
    <text x="1196" y="354" fill="#202c27" font-size="20" font-weight="750">Receipt and</text>
    <text x="1196" y="380" fill="#202c27" font-size="20" font-weight="750">next action</text>
    <text x="1196" y="417" fill="#53625b" font-size="14">Status remains distinct</text>
  </g>

  <rect x="56" y="500" width="1328" height="128" fill="#e6f0ea" stroke="#235b49" stroke-width="2"/>
  <rect x="56" y="500" width="10" height="128" fill="#235b49"/>
  <text x="88" y="542" fill="#193e32" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Human checkpoint</text>
  <text x="88" y="577" fill="#202c27" font-family="Segoe UI, Arial, sans-serif" font-size="18">You complete authentication, review the final portal page, attest, and approve each submission.</text>
  <text x="88" y="655" fill="#53625b" font-family="Segoe UI, Arial, sans-serif" font-size="16">Synthetic training is tested. Live BenefitsCal filing, county acceptance, and production deployment are not verified.</text>
</svg>